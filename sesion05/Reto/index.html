<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style/style.css">
</head>
<body>
    <h1>Formulario de inscripción</h1>
    <form id="formInscripcion">
        <fieldset class="seccion-datos">
            <legend>Datos personales</legend>

            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" required minlength="3">
                <small class="error" id="error-nombre"></small>
            </div>

            <div class="campo">
                <label for="documento">Documento</label>
                <input type="text" id="documento" name="documento" inputmode="numeric" pattern="[0-9]{6,10}" title="Solo números. Entre 6 a 10 digitos" required>
                <small class="error" id="error-documento"></small>
            </div>

            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" required>
                <small class="error" id="erro-correo"></small>
            </div>
            
            <div class="campo">
                <label for="telefono">Celular</label>
                <input type="tel" id="telefono" name="telefono" pattern="3[0-9]{9}" title="Debe tener 10 digitos que empiecen por 3" required>
                <small class="error" id="error-telefono"></small>
            </div>
        </fieldset>

        <fieldset class="seccion-cursos">
            <legend>Curso</legend>
            <div class="campo">
                <label for="programa">programa</label>
                <select name="programa" id="programa" required>
                    <option value="">Eliga una opción</option>
                    <option value="diseño web">Diseño web</option>
                    <option value="javascript">Javascript</option>
                    <option value="python">Python</option>
                </select>
                <small class="error" id="error-programa"></small>
            </div>

            <fieldset class="seccion-jornadas">
                <legend>Jornada</legend>
                <div class="opciones-jornada">
                    <label><input type="radio" name="jornada" value="mañana" required>Mañana</label>
                    <label><input type="radio" name="jornada" value="tarde">Tarde</label>
                    <label><input type="radio" name="jornada" value="noche">Noche</label>
                </div>
                <small class="error" id="error-jornada"></small>
            </fieldset>

            <fieldset class="seccion-terminos">
                <legend>Términos y condiciones</legend>
                    <label for="terminos"><input type="checkbox" name="terminos" id="terminos" required>Autorizo el tratamiento de mis datos personales.</label>
                <small class="error" id="error-terminos"></small>
            </fieldset>
        </fieldset>

        <button type="submit">Inscribirme</button>
    </form>
    <section id="resumen"></section>
</body>
</html>
