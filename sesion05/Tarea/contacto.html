<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbería</title>
    <link rel="stylesheet" type="text/css" href="style/style.css">
</head>
<body class="pagina-contacto">
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>
        <main>
            <!-- EXPLICACIÓN DEL ATRIBUTO NAME: el atributo name se usa  para identificar un campo cuando se envían los datos de un formulario. Por ejemplo en un input que tiene name = "nombre", si el usuario escribe Erick, entonces nombre=Erick, indicando que el dato ingresado en ese input corresponde al nombre del usuario-->
            <form class="formulario-contacto">
                <h2>Contáctanos</h2>
                <p>Estamos aquí para atenderte.</p>

                <div class="campo">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
        
                <div class="campo">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" required>
                </div>

                <div class="campo">
                    <label for="celular">Celular</label>
                    <input type="tel" id="celular" name="celular">
                </div>
        
                <div class="campo">
                    <label for="motivo">Motivo de contacto</label>
                    <select id="motivo" name="motivo" required>
                        <option value="">Selecciona un motivo</option>
                        <option value="pedido">Pedido</option>
                        <option value="pregunta">Pregunta</option>
                        <option value="queja">Queja</option>
                    </select>
                </div>
        
                <div class="campo">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" name="mensaje" required></textarea>
                </div>

                <button type="submit">Enviar mensaje</button>
            </form>

            <section>
                <h1>Otros medios de contacto</h1>
                    <p><a href="//wa.me//573045716185" target="_blank">Whatsapp</a></p>
                    <img src="img/whatsapp.png" alt="logo-whatsapp">
                    <p><a href="mailto:erickdo017@gmail.com">Correo electrónico</a></p>
                    <img src="img/gmail.png" alt="logo-gmail">
                <h2>Ubicación de nuestro local principal</h2>
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.3883532585232!2d-75.57377322597405!3d6.212403693775506!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e44282b8124452b%3A0x574eae61fce28e1c!2sLondon%20City%20Barber%20Shop%20(Manila%2C%20El%20Poblado)!5e0!3m2!1ses-419!2sco!4v1791409546862!5m2!1ses-419!2sco" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>
        </main>
        <footer>
            <p>Todos los derechos reservados - 2026</p>
        </footer>




</body>
</html>
