<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi lista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style/style.css">
</head>

<body>
    <main class="main">
        <header class="header">
            <div class="header__info">
                <h1>Tu lista de compra, <span class="purple">siempre en mano</span></h1>
                <p>Agrega, organiza y marca tus productos de forma fácil y rápida.</p>
            </div>
            <div class="header__img">
                <img src="img/carrito-header.png">
            </div>
        </header>
        <form class="form">
            <h2>Agregar producto</h2>
            <div class="form__container-input">
                <textarea placeholder="Ej: Leche, Pan, Manzanas"></textarea>
                <button>+ Agregar</button>
            </div>
            <p id="alerta">Escribe al menos un producto antes de agregar ⚠</p>
        </form>
        <div class="container-list">
            <header class="header-list">
                <img src="img/icono-lista.png">
                <h2>Mi lista</h2>
        </header>
            <ul class="list-shopping">
                <li class="list__item">
                    <div class="container-checkbox">
                        <input type="checkbox">
                        <span>Leche</span>
                    </div>
                    <button aria-label="Eliminar"><img src="img/icono-eliminar.png" alt="eliminar"></button>
                </li>
                <li class="list__item">
                    <div class="container-checkbox">
                        <input type="checkbox">
                        <span>Pan</span>
                    </div>
                    <button aria-label="Eliminar"><img src="img/icono-eliminar.png" alt="eliminar"></button>
                </li>
                <li class="list__item">
                    <div class="container-checkbox">
                        <input type="checkbox">
                        <span>Manzanas</span>
                    </div>
                    <button aria-label="Eliminar"><img src="img/icono-eliminar.png" alt="eliminar"></button>
                </li>
            </ul>
            <div class="container-counter">
                <button class="delete-all"><img src="img/icono-eliminar.png">Eliminar seleccionados</button>
                <p>Tareas completadas: 1 / 3</p>
            </div>
        </div>
    </main>
</body>

</html>
